<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>曜日天梯榜 - MAGI SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --eva-dark-bg: #0b0b0e;
            --eva-purple: #9d5df2;
            --eva-green: #39ff14;
            --eva-orange: #ff9900;
            --color-platinum: #00bfff;
            --color-gold: #ffd700;
            --color-silver: #ff0f4f;
            --color-bronze: #39ff14;
            --glass-bg: rgba(25, 25, 30, 0.95);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--eva-dark-bg);
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* === Loading === */
        #loadingOverlay {
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; align-items: center; justify-content: center; flex-direction: column;
            transition: opacity 0.5s ease;
        }
        .loader-text { color: var(--eva-orange); font-family: 'Orbitron', sans-serif; font-size: 2rem; animation: blink 0.5s infinite alternate; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }

        /* === Background Effects === */
        .scanline-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%; pointer-events: none;
        }
        .tactical-grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: linear-gradient(rgba(157, 93, 242, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(157, 93, 242, 0.1) 1px, transparent 1px);
            background-size: 40px 40px; transform: perspective(500px) rotateX(20deg) scale(1.5);
            animation: gridMove 20s linear infinite; pointer-events: none;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }

        /* === Header === */
        .sticky-controls {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(11, 11, 14, 0.98); backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--eva-purple); padding-bottom: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
        }
        .header-box {
            padding: 20px 0 15px 0; margin-bottom: 10px; position: relative;
            background: linear-gradient(0deg, rgba(157, 93, 242, 0.1) 0%, transparent 100%);
            border-top: 1px solid rgba(157, 93, 242, 0.3);
        }
        .title-card {
            font-family: 'Noto Sans TC', sans-serif; font-size: 2.5rem; font-weight: 900; letter-spacing: 0.1em;
            color: #fff; text-align: center; text-shadow: 2px 2px 0px #000, -1px -1px 0 var(--eva-purple), 0 0 20px var(--eva-purple);
            margin: 0; line-height: 1; transform: scaleY(1.1);
        }
        .sub-title {
            font-family: 'Orbitron', sans-serif; font-size: 0.65rem; color: var(--eva-green); letter-spacing: 3px;
            display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 8px; font-weight: bold;
        }
        .sub-title::before, .sub-title::after { content: ""; display: block; width: 40px; height: 2px; background: var(--eva-green); box-shadow: 0 0 5px var(--eva-green); }
        .deco-corner-text { position: absolute; font-family: 'Orbitron', monospace; font-size: 0.5rem; color: var(--eva-orange); opacity: 0.8; line-height: 1.2; }
        .deco-tl { top: 8px; left: 15px; border-left: 2px solid var(--eva-orange); padding-left: 6px; }
        .deco-br { bottom: 8px; right: 15px; border-right: 2px solid var(--eva-orange); padding-right: 6px; text-align: right; }

        /* === Filters === */
        .filter-container { width: 100%; overflow-x: auto; padding: 5px 10px; }
        .filter-group { display: flex; justify-content: flex-start; gap: 10px; white-space: nowrap; padding-bottom: 5px; }
        .filter-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #444; color: #888; 
            padding: 10px 15px; cursor: pointer; font-size: 0.75rem; border-radius: 2px; transition: 0.2s;
            flex: 0 0 auto; min-width: 90px; text-align: center; 
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif; font-weight: 700; letter-spacing: 1px;
            /* 手機點擊回饋 */
            touch-action: manipulation;
        }
        .filter-btn:active { transform: scale(0.95); }
        .filter-btn.active { color: #000 !important; font-weight: 900; transform: scale(1.02); border: none; }
        .btn-all.active { background: #fff; box-shadow: 0 0 8px #fff; }
        .btn-plat.active { background: var(--color-platinum); box-shadow: 0 0 10px var(--color-platinum); }
        .btn-gold.active { background: var(--color-gold); box-shadow: 0 0 10px var(--color-gold); }
        .btn-silver.active { background: var(--color-silver); box-shadow: 0 0 10px var(--color-silver); }
        .btn-bronze.active { background: var(--color-bronze); box-shadow: 0 0 10px var(--color-bronze); }

        .search-box { display: flex; justify-content: center; padding: 5px 15px; }
        #searchInput {
            background: rgba(0,0,0,0.6); border: 1px solid var(--eva-purple);
            color: #fff; padding: 12px; width: 100%; max-width: 600px;
            text-align: center; border-radius: 30px; font-size: 16px;
            outline: none; transition: 0.3s;
            font-family: 'Noto Sans TC', sans-serif;
        }
        #searchInput:focus { border-color: var(--eva-green); box-shadow: 0 0 10px rgba(57, 255, 20, 0.2); }

        /* === List View === */
        .ladder-wrapper { max-width: 1200px; margin: 0 auto; padding: 10px 5px; position:relative; z-index:1; }
        table { width: 100%; border-spacing: 0 4px; border-collapse: separate; table-layout: fixed; }
        thead th {
            color: #666; font-size: 0.65rem; padding: 10px 5px; text-transform: uppercase; 
            background: rgba(17, 17, 17, 0.9); border-bottom: 2px solid #333; font-family: 'Orbitron', sans-serif;
        }
        .col-rank { width: 15%; text-align: center; } 
        .col-pilot { width: 65%; text-align: left; padding-left: 10px; }
        .col-sync { width: 20%; text-align: center; }
        @media (max-width: 600px) {
            .col-rank { width: 18%; }
            .col-pilot { width: 60%; }
            .col-sync { width: 22%; }
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* === List Items === */
        tbody.list-view tr { background: var(--glass-bg); cursor: pointer; display: table-row; transition: transform 0.1s, background 0.2s; animation: slideIn 0.4s both; }
        tbody.list-view tr:hover { background: rgba(157, 93, 242, 0.15); transform: scale(1.01); }
        /* 手機點擊回饋 */
        tbody.list-view tr:active, tbody.card-view tr:active { transform: scale(0.98); }
        tbody.list-view td { padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        
        /* Card View Layout */
        tbody.card-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; padding: 10px; }
        tbody.card-view tr { 
            display: flex; flex-direction: column; background: var(--glass-bg); border-radius: 6px; position: relative; padding: 15px; animation: slideIn 0.5s both;
            border: 1px solid #333; height: auto; overflow: hidden; cursor: pointer; transition: transform 0.1s;
        }
        tbody.card-view td { display: block; width: 100%; border: none; text-align: left; padding: 0; }
        tbody.card-view .col-rank { display: none !important; }

        /* 分組邊框 */
        tbody.card-view tr.row-platinum { border: 2px solid var(--color-platinum) !important; box-shadow: 0 0 15px rgba(0, 191, 255, 0.2) !important; }
        tbody.card-view tr.row-platinum::before { content: "CLASSIFIED // TOP SECRET"; position: absolute; top: 0; left: 0; width: 100%; background: var(--color-platinum); color: #000; font-size: 0.5rem; font-weight: 900; text-align: center; padding: 1px; z-index: 2; }

        tbody.card-view tr.row-gold { border: 1px solid var(--color-gold) !important; box-shadow: 0 0 15px rgba(255, 215, 0, 0.15) !important; }
        tbody.card-view tr.row-gold::before { content: "PRIORITY // FIRST CLASS"; position: absolute; top: 0; left: 0; width: 100%; background: linear-gradient(90deg, transparent, var(--color-gold), transparent); color: #000; font-size: 0.5rem; font-weight: 900; text-align: center; padding: 1px; z-index: 2; }

        tbody.card-view tr.row-silver { border: 1px solid var(--color-silver) !important; box-shadow: inset 0 0 20px rgba(255, 15, 79, 0.05) !important; }
        tbody.card-view tr.row-silver::before { content: "TACTICAL // RESERVE"; position: absolute; top: 0; left: 0; width: 100%; background: rgba(255, 15, 79, 0.1); border-bottom: 1px solid var(--color-silver); color: var(--color-silver); font-size: 0.5rem; font-weight: 900; text-align: center; padding: 1px; z-index: 2; }

        tbody.card-view tr.row-bronze { border: 1px dashed var(--color-bronze) !important; background-image: linear-gradient(0deg, transparent 50%, rgba(57, 255, 20, 0.02) 50%); background-size: 100% 4px; }
        tbody.card-view tr.row-bronze::before { content: "CALIBRATING // TRAINEE"; position: absolute; top: 0; left: 0; width: 100%; background: rgba(57, 255, 20, 0.1); color: var(--color-bronze); font-size: 0.5rem; font-weight: 900; text-align: center; padding: 1px; z-index: 2; }

        tbody.list-view .card-only { display: none !important; }
        tbody.card-view .list-only { display: none !important; }

        /* Rank Badge */
        .rank-badge-box {
            display: inline-block; width: 42px; height: 42px; line-height: 42px;
            text-align: center; border-radius: 50%; font-family: 'Orbitron', sans-serif; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1); color: #888;
        }
        .rank-1-style { font-size: 1.8rem; color: #000; background: #ffd700; box-shadow: 0 0 15px #ffd700; border: 2px solid #fff; transform: scale(1.1); }
        .rank-2-style { font-size: 1.5rem; color: #000; background: #e0e0e0; box-shadow: 0 0 10px #e0e0e0; border: 2px solid #888; }
        .rank-3-style { font-size: 1.5rem; color: #000; background: #cd7f32; box-shadow: 0 0 10px #cd7f32; border: 2px solid #8B4513; }
        .rank-top10-style { font-size: 1.4rem; color: #fff; font-style: italic; text-shadow: 0 0 8px rgba(255,255,255,0.8); width: auto; height: auto; border-radius: 0; border: none; }

        .list-name { font-weight: bold; font-size: 1rem; color: #fff; display: block; line-height: 1.2; }
        .list-id { font-size: 0.65rem; color: #aaa; font-family: 'Orbitron', monospace; display: inline-block; margin-right: 5px; color: var(--eva-orange);}
        .list-score { font-family: 'Orbitron'; font-size: 1.3rem; color: var(--eva-green); text-align: center; letter-spacing: 1px; }
        
        .team-badge {
            display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px;
            border: 1px solid #555; color: #888; background: rgba(0, 0, 0, 0.3);
            font-weight: 900; letter-spacing: 1px; vertical-align: middle;
            text-shadow: 0 0 5px rgba(0,0,0,0.8); box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        
        .card-header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; position: relative; z-index: 10; }

        .pilot-tag { 
            font-size: 0.6rem; color: var(--eva-orange); border: 1px solid var(--eva-orange); 
            padding: 2px 8px; border-radius: 3px; display: inline-block; margin-bottom: 0; 
            font-weight: bold; background: rgba(0,0,0,0.6); box-shadow: 0 0 5px rgba(255, 153, 0, 0.2);
        }

        .score-bg-watermark {
            position: absolute; top: 0px; right: 10px; font-size: 5rem; font-family: 'Impact', sans-serif;
            color: #fff; opacity: 0.08; pointer-events: none; z-index: 1;
        }
        .card-name { font-size: 1.4rem; font-weight: 900; color: #fff; position: relative; z-index: 10; }
        .card-info { font-size: 0.7rem; color: #888; font-family: 'Orbitron', monospace; margin-bottom: 5px; position: relative; z-index: 10; }
        .card-latest-row {
            font-size: 0.75rem; color: #ccc; margin-bottom: 10px; 
            background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 2px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 3px solid var(--eva-green); position: relative; z-index: 10;
        }
        .result-highlight { color: #fff; font-weight: bold; text-shadow: 0 0 8px var(--eva-green); animation: pulseText 2s infinite; }
        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .sync-bar-container { width: 100%; height: 14px; background: #000; margin: 8px 0; border-radius: 2px; overflow: hidden; border: 1px solid #444; position: relative; z-index: 10;}
        
        .sync-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #004d00 0%, var(--eva-green) 50%, #ccffcc 100%); 
            background-size: 200% 100%; 
            box-shadow: 0 0 20px var(--eva-green);
            transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .stats-hud { display: flex; justify-content: space-between; gap: 5px; font-size: 0.65rem; color: #888; font-family: 'Orbitron', monospace; border-top: 1px solid #333; padding-top: 8px; margin-top: 8px; position: relative; z-index: 10;}

        /* === Modal Environment & Card Styles === */
        .modal { 
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; 
            align-items: center; justify-content: center; 
            opacity: 0; pointer-events: none; 
            transition: opacity 0.3s ease; 
            background-color: rgba(0, 0, 0, 0.85); 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .modal.active { opacity: 1; pointer-events: auto; }

        #modalBgLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; overflow: hidden;
        }

        /* --- 階級專屬大背景特效 --- */
        .bg-ssr { background: rgba(0, 0, 0, 0.95); }
        .bg-ssr::before, .bg-ssr::after {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            filter: blur(60px); opacity: 0.35; pointer-events: none;
        }
        .bg-ssr::before {
            background: radial-gradient(circle at 30% 30%, rgba(255, 0, 128, 0.5) 0%, transparent 20%),
                        radial-gradient(circle at 70% 70%, rgba(0, 255, 255, 0.5) 0%, transparent 20%),
                        radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.4) 0%, transparent 25%);
            animation: rainbowSmoke 15s infinite alternate ease-in-out;
        }
        .bg-ssr::after {
            background: radial-gradient(circle at 70% 30%, rgba(138, 43, 226, 0.5) 0%, transparent 20%),
                        radial-gradient(circle at 30% 70%, rgba(57, 255, 20, 0.5) 0%, transparent 20%);
            animation: rainbowSmokeRev 20s infinite alternate-reverse ease-in-out;
        }
        @keyframes rainbowSmoke {
            0% { transform: rotate(0deg) translate(0, 0) scale(1); }
            50% { transform: rotate(45deg) translate(5%, 5%) scale(1.1); }
            100% { transform: rotate(90deg) translate(-5%, -5%) scale(1); }
        }
        @keyframes rainbowSmokeRev {
            0% { transform: rotate(0deg) translate(0, 0) scale(1); }
            50% { transform: rotate(-45deg) translate(-5%, 5%) scale(1.2); }
            100% { transform: rotate(-90deg) translate(5%, -5%) scale(1); }
        }

        .bg-sr { background: radial-gradient(ellipse at bottom, #090a15 0%, #000000 100%); }
        .bg-sr::before, .bg-sr::after {
            content: ""; position: absolute; top: 0; left: 0; width: 200%; height: 200%; pointer-events: none;
        }
        .bg-sr::before {
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 150px 140px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 220px 60px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 280px 180px, rgba(255,255,255,0.9), rgba(0,0,0,0));
            background-size: 300px 300px; animation: starryScroll 60s linear infinite; opacity: 0.8;
        }
        .bg-sr::after {
            background-image: 
                radial-gradient(1px 1px at 50px 160px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 200px 210px, rgba(255,255,255,0.5), rgba(0,0,0,0));
            background-size: 200px 200px; animation: starryScrollFast 40s linear infinite; opacity: 0.5; transform: rotate(15deg);
        }
        @keyframes starryScroll { from { background-position: 0 0; } to { background-position: 0 -900px; } }
        @keyframes starryScrollFast { from { background-position: 0 0; } to { background-position: 200px -600px; } }

        .bg-s { background: linear-gradient(rgba(157, 93, 242, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(157, 93, 242, 0.05) 1px, transparent 1px); background-size: 50px 50px; transform: perspective(500px) rotateX(45deg); transform-origin: center top; }
        .bg-s::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 10px; background: var(--eva-purple); box-shadow: 0 0 20px var(--eva-purple); animation: scanlineVertical 4s ease-in-out infinite alternate; opacity: 0.6; }
        @keyframes scanlineVertical { 0% { top: -10%; } 100% { top: 110%; } }

        .bg-a { background: radial-gradient(circle at center, rgba(57, 255, 20, 0.05) 0%, transparent 50%); }
        .bg-a::before {
            content: ""; position: absolute; top: 50%; left: 50%; width: 100vmax; height: 100vmax; transform: translate(-50%, -50%);
            background: repeating-radial-gradient(circle at center, transparent 0, transparent 40px, rgba(57, 255, 20, 0.1) 42px, transparent 44px); animation: radarPulse 8s linear infinite;
        }
        @keyframes radarPulse { from { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

        .bg-b { background: repeating-linear-gradient(45deg, rgba(255, 153, 0, 0.05), rgba(255, 153, 0, 0.05) 40px, transparent 40px, transparent 80px); background-size: 200% 200%; animation: warningScroll 20s linear infinite; }
        @keyframes warningScroll { from { background-position: 0 0; } to { background-position: 100% 100%; } }

        .bg-c { background: radial-gradient(circle at center, rgba(100, 100, 100, 0.1) 0%, transparent 60%); animation: breathe 6s ease-in-out infinite alternate; }
        @keyframes breathe { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }

        /* --- 卡片主體樣式 --- */
        .modal-card { 
            width: 320px; height: 620px; background: linear-gradient(145deg, #1a1a1f, #0b0b0e); 
            border-radius: 15px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8); 
            overflow: hidden; display: flex; flex-direction: column; 
            border: 2px solid #444; 
            /* GPU 加速與 3D 基礎設定 */
            transform-style: preserve-3d; 
            will-change: transform;
            animation: cardEntrance 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: default; 
            z-index: 10; 
        }

        /* 手機高度不足時自動縮放卡片防裁切 */
        @media (max-height: 680px) {
            .modal-card { transform: scale(0.85); animation: cardEntranceMobile 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        }

        .modal-card-dynamic-bg { display: none; }

        .modal-card.rank-ssr { border: 3px solid #ffd700; box-shadow: 0 0 60px rgba(255, 215, 0, 0.5); }
        .modal-card.rank-ssr::after { content: '👑'; font-size: 150px; position: absolute; top: 10%; left: 50%; transform: translateX(-50%) rotate(-10deg); opacity: 0.1; z-index: 0; filter: drop-shadow(0 0 10px gold); }

        .modal-card.rank-sr { border: 2px solid #00bfff; box-shadow: 0 0 40px rgba(0, 191, 255, 0.4); }
        .modal-card.rank-sr::after { content: '💠'; font-size: 150px; position: absolute; top: 10%; left: 50%; transform: translateX(-50%); opacity: 0.1; z-index: 0; }

        .modal-card.rank-s { border: 2px solid var(--eva-purple); box-shadow: 0 0 30px rgba(157, 93, 242, 0.3); }
        .modal-card.rank-s::after { content: '★'; font-size: 150px; position: absolute; top: 10%; left: 50%; transform: translateX(-50%); opacity: 0.1; z-index: 0; color: var(--eva-purple); }

        .modal-card.rank-a { border: 1px solid var(--eva-green); box-shadow: 0 0 20px rgba(57, 255, 20, 0.2); }
        .modal-card.rank-a::after { content: '❮'; font-size: 150px; position: absolute; top: 10%; left: 50%; transform: translateX(-50%) rotate(90deg); opacity: 0.1; z-index: 0; color: var(--eva-green); }

        .modal-card.rank-b { border: 1px solid var(--eva-orange); box-shadow: 0 0 10px rgba(255, 15, 79, 0.2); }
        .modal-card.rank-b::after { content: '●'; font-size: 150px; position: absolute; top: 10%; left: 50%; transform: translateX(-50%); opacity: 0.05; z-index: 0; color: var(--eva-orange); }

        .modal-card.rank-c { border: 1px solid #555; background: #111; }

        @keyframes cardEntrance { from { opacity: 0; transform: scale(0.8) translateY(50px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes cardEntranceMobile { from { opacity: 0; transform: scale(0.7) translateY(50px); } to { opacity: 1; transform: scale(0.85) translateY(0); } }

        .close-modal {
            position: absolute; top: 0; right: 0; width: 45px; height: 45px; /* 稍微放大增加手機點擊範圍 */
            background: rgba(255, 255, 255, 0.1); border-left: 1px solid rgba(255, 255, 255, 0.3); border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; justify-content: center; font-family: sans-serif; font-size: 1.8rem; color: #fff;
            cursor: pointer; z-index: 100; transition: 0.2s; border-bottom-left-radius: 8px;
        }
        .close-modal:hover, .close-modal:active { background: var(--color-silver); color: #000; box-shadow: 0 0 15px rgba(255, 15, 79, 0.5); }

        .card-header-bar {
            height: 45px; background: linear-gradient(90deg, rgba(50,50,60,0.8), rgba(20,20,30,0.8));
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 45px 0 15px; border-bottom: 1px solid #555; z-index: 2;
        }
        .header-tier-text { font-family: 'Orbitron'; font-size: 1.0rem; letter-spacing: 1px; color: #fff; font-weight: 900; white-space: nowrap; overflow: visible; }
        .header-stars { color: #ffd700; font-size: 0.8rem; letter-spacing: 2px; margin-right: 10px; flex-shrink: 0; }

        .card-visual-area {
            flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
            overflow: hidden; background: radial-gradient(circle at center, rgba(255,255,255,0.02) 0%, transparent 70%); z-index: 5;
        }
        .cartoon-avatar { width: auto; height: 80%; z-index: 10; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6)); animation: bob 3s ease-in-out infinite; }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .card-radar-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 250px; height: 250px; opacity: 0.3; z-index: 1; animation: radarRotate 20s linear infinite; }
        @keyframes radarRotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .battle-type-badge {
            position: absolute; top: 12px; left: 12px; background: #000; border: 1px solid var(--eva-orange);
            color: var(--eva-orange); font-size: 0.6rem; padding: 3px 8px; z-index: 10; font-weight: bold;
            font-family: 'Orbitron', monospace; letter-spacing: 1px; box-shadow: 0 0 5px rgba(255, 153, 0, 0.5);
        }
        .pilot-title {
            position: absolute; bottom: 15px; left: 0; width: 100%; text-align: center; color: #fff; font-size: 0.8rem; font-weight: bold;
            text-shadow: 0 0 5px #000; font-style: italic; z-index: 10; background: rgba(0,0,0,0.6); padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .card-info-area { background: rgba(10, 10, 15, 0.85); padding: 15px; border-top: 2px solid #444; z-index: 10; }
        .info-name { font-size: 1.5rem; font-weight: 900; color: #fff; line-height: 1; margin-bottom: 5px; }
        .info-meta { font-size: 0.7rem; color: #888; font-family: 'Orbitron', monospace; display: flex; justify-content: space-between; }
        
        .card-sync-box { margin-top: 10px; background: rgba(0,0,0,0.5); border: 1px solid #333; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; }
        .card-sync-label { font-size: 0.6rem; color: var(--eva-green); }
        .card-sync-val { font-family: 'Impact'; font-size: 1.5rem; color: #fff; }
        
        .skill-chips { display: flex; gap: 5px; margin-top: 8px; }
        .chip { flex: 1; background: rgba(34,34,34,0.6); border: 1px solid #444; color: #aaa; font-size: 0.6rem; text-align: center; padding: 2px 0; border-radius: 2px; }

        .card-history-box { margin-top: 10px; background: rgba(0, 0, 0, 0.3); border: 1px solid #333; padding: 6px; border-radius: 4px; }
        .history-label { font-size: 0.6rem; color: #888; border-bottom: 1px solid #444; margin-bottom: 5px; font-family: 'Orbitron', monospace; display: flex; justify-content: space-between; }
        .history-list-content { font-family: 'Noto Sans TC', monospace; font-size: 0.7rem; color: #ccc; max-height: 60px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 5px; }
        .history-list-content::-webkit-scrollbar { width: 3px; }
        .history-list-content::-webkit-scrollbar-thumb { background: var(--eva-green); }

        .history-tag { background: rgba(57, 255, 20, 0.1); border: 1px solid rgba(57, 255, 20, 0.3); color: var(--eva-green); padding: 2px 8px; border-radius: 2px; font-size: 0.65rem; }

    </style>
</head>
<body>

    <div class="scanline-overlay"></div>
    <div class="tactical-grid-bg"></div>

    <div id="loadingOverlay"><div class="loader-text">MAGI SYSTEM INITIALIZING</div></div>

    <div id="playerModal" class="modal">
        <div id="modalBgLayer"></div>
    </div>

    <div class="sticky-controls">
        <div class="header-box">
            <div class="deco-corner-text deco-tl">MAGI<br>SYS.</div>
            <div class="deco-corner-text deco-br">VER<br>28.0<br>MOB.OPT</div>
            <div class="title-card">曜日天梯榜</div>
            <div class="sub-title">SOLAR CUP LEAGUE</div>
        </div>

        <div class="filter-container">
            <div class="filter-group">
                <button class="filter-btn btn-all active" onclick="filterTier('all')">ALL (總覽)</button>
                <button class="filter-btn btn-plat" onclick="filterTier('platinum')">PLATINUM // 白金級</button>
                <button class="filter-btn btn-gold" onclick="filterTier('gold')">GOLD // 黃金級</button>
                <button class="filter-btn btn-silver" onclick="filterTier('silver')">SILVER // 白銀級</button>
                <button class="filter-btn btn-bronze" onclick="filterTier('bronze')">BRONZE // 青銅級</button>
            </div>
        </div>
        <div class="search-box"><input type="text" id="searchInput" oninput="searchPilot()" placeholder="搜尋 ID、姓名或球團..."></div>
    </div>

    <div class="ladder-wrapper">
        <div style="background: linear-gradient(90deg, var(--eva-purple), transparent); padding: 4px 15px; font-size: 0.65rem; margin-bottom: 10px; position:relative; z-index:1;">MAGI_VER.28.0: TACTICAL_OPS_READY</div>
        <table id="ladderTable">
            <thead id="tableHead">
                <tr>
                    <th class="col-rank">RANK</th>
                    <th class="col-pilot">PILOT / ID / TEAM</th>
                    <th class="col-sync">SYNC</th>
                </tr>
            </thead>
            <tbody id="tableBody" class="list-view"></tbody>
        </table>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQSyuNa2uiXkcvRI-MQa_yZDdJEbpy-ZclLRF0vzk-Xl0JV_Ux425c0kUlHXNXFO-dsLxeftMp9rRFX/pub?output=csv";
        
        let currentFilter = 'all';
        let globalPilots = [];

        window.onload = () => {
            fetch(CSV_URL + "&t=" + Date.now())
            .then(res => res.arrayBuffer())
            .then(buffer => {
                const csvText = new TextDecoder("utf-8").decode(buffer);
                const workbook = XLSX.read(csvText, {type: 'string'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
                
                process(json.slice(1));
            })
            .catch(err => {
                console.error("資料解析錯誤", err);
                document.getElementById('loadingOverlay').innerHTML = `<div style="color:red; font-family:'Orbitron';">ERROR: MAGI DATABASE CONNECTION FAILED.</div>`;
            });
        };

        function process(rows) {
            globalPilots = rows.map(r => {
                let rawHistory = r.slice(5);
                let cleanHistory = rawHistory.filter(x => {
                    if (x === undefined || x === null) return false;
                    let str = String(x).trim();
                    if (str === "" || str === "#N/A") return false;
                    if (!isNaN(str) && !isNaN(parseFloat(str))) return false; 
                    return true;
                }).map(String);

                return {
                    id: String(r[0] || "?"), 
                    name: String(r[1] || "N/A"), 
                    team: String(r[2] || "-"),
                    tier: String(r[3] || "青銅級"), 
                    score: parseInt(r[4]) || 0,
                    history: cleanHistory
                };
            }).filter(p => p.name !== "N/A" && p.name.trim() !== "").sort((a,b) => b.score - a.score);
            
            render(globalPilots);
            
            const loader = document.getElementById('loadingOverlay');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }

        function getTeamColor(name) {
            if (!name || name === '-') return '#888';
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 85%, 65%)`;
        }

        function render(pilots) {
            const container = document.getElementById("tableBody");
            container.innerHTML = "";
            let rank = 1;
            
            pilots.forEach((p, i) => {
                if (i > 0 && p.score < pilots[i-1].score) rank = i + 1;
                
                const tierStr = String(p.tier);
                const tierKey = tierStr.includes("白金") ? "platinum" : tierStr.includes("黃金") ? "gold" : tierStr.includes("白銀") ? "silver" : "bronze";
                
                let rankClass = "rank-badge-box";
                let rankInlineStyle = "";
                if (rank === 1) rankClass += " rank-1-style";
                else if (rank === 2) rankClass += " rank-2-style";
                else if (rank === 3) rankClass += " rank-3-style";
                else if (rank <= 10) rankClass += " rank-top10-style";
                else {
                    const norm = Math.min(rank, 100);
                    const hue = 30 + (norm * 2.2);
                    const light = Math.max(30, 75 - (norm * 0.4));
                    const fs = Math.max(0.8, 1.4 - (norm * 0.005));
                    rankInlineStyle = `color:hsl(${hue},100%,${light}%); border:1px solid hsl(${hue},50%,20%); font-size:${fs}rem; width:auto; height:auto; border-radius:0; line-height:normal; text-shadow:0 0 5px hsl(${hue},100%,20%);`;
                }

                const barWidth = Math.min(100, (p.score / 420) * 100);
                const atField = ((p.score / 4.5) + 12).toFixed(1);
                const evaluation = p.score > 350 ? "傳說級駕駛員" : (p.score > 250 ? "覺醒確認" : "適格者");

                const latestHistory = p.history.length > 0 ? p.history[p.history.length - 1] : "N/A";
                const latestCup = p.history.length > 0 ? `CUP-${String(p.history.length).padStart(2,'0')}` : "NO DATA";
                const tierName = tierStr.split(' ')[0]; 
                const resultText = p.history.length > 0 ? (String(latestHistory).includes(tierName) ? latestHistory : `${tierName} ${latestHistory}`) : "NO COMBAT DATA";

                const teamColor = getTeamColor(p.team);
                const teamBadgeStyle = `border-color:${teamColor}; color:${teamColor}; box-shadow: 0 0 8px ${teamColor}40;`;

                const tr = document.createElement("tr");
                tr.className = `row-${tierKey}`;
                tr.dataset.tier = tierKey;
                tr.dataset.json = JSON.stringify({...p, rank, tierKey, barWidth});
                
                const currentRank = rank;
                tr.onclick = () => openModal(p, currentRank, barWidth);

                tr.innerHTML = `
                    <td class="rank-num text-${tierKey} col-rank">
                        <div class="${rankClass}" style="${rankInlineStyle}">${rank < 10 ? '0'+rank : rank}</div>
                    </td>
                    <td class="col-pilot">
                        <div class="list-only">
                            <div class="list-name">${p.name}</div>
                            <span class="list-id">ID: ${p.id}</span>
                            ${p.team && p.team !== '-' ? `<span class="team-badge" style="${teamBadgeStyle}">${p.team}</span>` : ''}
                        </div>

                        <div class="card-only">
                            <div class="score-bg-watermark">${p.score}</div>
                            
                            <div class="card-header-row">
                                <div class="${rankClass}" style="${rankInlineStyle}">${rank < 10 ? '0'+rank : rank}</div>
                                <div class="pilot-tag">${p.tier} // ${evaluation}</div>
                            </div>

                            <div class="card-name">${p.name}</div>
                            <div class="card-info">ID: ${p.id} ${p.team !== '-' ? `| TEAM: <span style="color:${teamColor}; font-weight:bold;">${p.team}</span>` : ''}</div>
                            
                            <div class="card-latest-row">
                                <span style="color:var(--eva-green)">LAST // ${latestCup}</span>
                                <span class="result-highlight">${resultText}</span>
                            </div>

                            <div class="sync-bar-container"><div class="sync-fill" style="width: ${barWidth}%"></div></div>
                            <div class="stats-hud">
                                <div>A.T. FIELD: ${atField}%</div>
                                <div>BERSERK: ${(p.score % 14).toFixed(1)}%</div>
                            </div>
                        </div>
                    </td>
                    <td class="col-sync">
                        <div class="list-score">${p.score}</div>
                    </td>
                `;
                container.appendChild(tr);
            });
            
            filterTier(currentFilter);
        }

        function filterTier(tier) {
            currentFilter = tier;
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            const btnSelector = tier === 'platinum' ? '.btn-plat' : '.btn-' + tier;
            const targetBtn = document.querySelector(btnSelector);
            if(targetBtn) targetBtn.classList.add("active");
            
            const body = document.getElementById("tableBody");
            const head = document.getElementById("tableHead");
            
            if (tier === 'all') {
                body.className = "list-view";
                head.style.display = "table-header-group";
            } else {
                body.className = "card-view";
                head.style.display = "none";
            }
            searchPilot();
        }

        function searchPilot() {
            const inputVal = document.getElementById("searchInput").value;
            const term = inputVal ? inputVal.toUpperCase().trim() : "";
            const isListView = document.getElementById("tableBody").classList.contains("list-view");

            let visibleIndex = 0;
            document.querySelectorAll("#tableBody tr").forEach(tr => {
                const data = JSON.parse(tr.dataset.json);
                const tierKey = tr.dataset.tier;
                
                const nameStr = String(data.name).toUpperCase();
                const idStr = String(data.id).toUpperCase();
                const teamStr = String(data.team).toUpperCase();

                const matchTerm = nameStr.includes(term) || idStr.includes(term) || teamStr.includes(term);
                const matchTier = (currentFilter === 'all') || (tierKey === currentFilter);
                
                if (matchTerm && matchTier) {
                    tr.style.display = isListView ? "table-row" : "flex";
                    tr.style.animation = 'none';
                    tr.offsetHeight; /* trigger reflow */
                    tr.style.animation = `slideIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) ${visibleIndex * 0.03}s both`;
                    visibleIndex++;
                } else {
                    tr.style.display = "none";
                }
            });
        }

        function calculateStars(score) {
            if (score >= 400) return '★★★★★';
            if (score >= 300) return '★★★★';
            if (score >= 200) return '★★★';
            if (score >= 100) return '★★';
            return '★';
        }

        function getBattleSettings(id) {
            const strId = String(id);
            let seed = 0;
            for (let i = 0; i < strId.length; i++) {
                seed = strId.charCodeAt(i) + ((seed << 5) - seed);
            }
            const seededRandom = function(offset) {
                var x = Math.sin(seed + offset) * 10000;
                return x - Math.floor(x);
            };

            const types = [
                { code: "ASSAULT", name: "ASSAULT // 強襲", color: "#ff4444" },
                { code: "FORTRESS", name: "FORTRESS // 鐵壁", color: "#4488ff" },
                { code: "SPEED", name: "SPEED // 高機動", color: "#ffee00" },
                { code: "TACTIC", name: "TACTIC // 戰術", color: "#00ffaa" }
            ];
            
            const titles = ["光速", "絕對", "不屈", "幻想", "暴走", "深淵", "極限", "虛空", "雷霆", "灼熱", "凍結", "神速", "鋼鐵", "無限", "混沌", "逆境", "奇蹟", "夢幻", "終極", "時空", "原子", "量子", "重力", "暗黑", "神聖", "血色", "蒼穹", "禁忌", "原始", "永恆", "瞬殺", "幻影", "無雙", "絕望", "希望", "榮耀", "毀滅", "創世", "覺醒", "暴虐"];
            const titles2 = ["支配者", "守護神", "切球手", "破壞者", "指揮官", "墮天使", "魔術師", "處刑人", "領航員", "突擊兵", "幻影", "主宰", "狙擊手", "狂戰士", "救世主", "幻想家", "審判者", "送葬人", "開拓者", "旅行者", "防衛者", "殲滅者", "狩獵者", "觀測者", "仲裁者", "先驅者", "征服者", "收割者", "流浪者", "復仇者", "繼承者", "統治者", "毀滅者", "創造者", "守望者", "引路人", "執行官", "破壞神", "武神", "劍聖"];

            const typeIndex = Math.floor(seededRandom(1) * types.length);
            const titleIndex1 = Math.floor(seededRandom(2) * titles.length);
            const titleIndex2 = Math.floor(seededRandom(3) * titles2.length);
            const imageIndex = Math.floor(seededRandom(4) * 20) + 1;

            return {
                type: types[typeIndex],
                title: `${titles[titleIndex1]}的 ${titles2[titleIndex2]}`,
                imageUrl: `https://api.dicebear.com/7.x/bottts/svg?seed=${strId}_${imageIndex}&textureChance=50`
            };
        }

        function openModal(p, rank, barWidth) {
            // 打開時鎖定背景滑動
            document.body.style.overflow = 'hidden';

            const settings = getBattleSettings(p.id);
            
            let luxuryClass = "rank-c"; let rankCode = "c"; let rankLabel = "C-RANK // UNIT";
            if (rank <= 3) { luxuryClass = "rank-ssr"; rankCode = "ssr"; rankLabel = "SSR // LEGEND"; }
            else if (rank <= 10) { luxuryClass = "rank-sr"; rankCode = "sr"; rankLabel = "SR // ELITE"; }
            else if (rank <= 30) { luxuryClass = "rank-s"; rankCode = "s"; rankLabel = "S-RANK // ACE"; }
            else if (rank <= 60) { luxuryClass = "rank-a"; rankCode = "a"; rankLabel = "A-RANK // MAIN"; }
            else if (rank <= 100) { luxuryClass = "rank-b"; rankCode = "b"; rankLabel = "B-RANK // SUP"; }
            else { luxuryClass = "rank-c"; rankCode = "c"; rankLabel = "C-RANK // UNIT"; }

            const stars = calculateStars(p.score); 
            const s = p.score;
            const attrs = [Math.min(99, 60+(s%30)), Math.min(99, 50+(s%40)), Math.min(99, 70+(s%20)), Math.min(99, 55+(s%35))];

            const currentTierName = String(p.tier).split(' ')[0];
            let historyHTML = "";
            if (p.history && p.history.length > 0) {
                historyHTML = p.history.map((record, index) => {
                    const cupName = `CUP-${String(index + 1).padStart(2, '0')}`;
                    const displayRecord = String(record).includes(currentTierName) ? record : `${currentTierName} ${record}`;
                    return `<div class="history-tag">${cupName}: ${displayRecord}</div>`;
                }).join("");
            } else {
                historyHTML = `<span style="color:#555; font-style:italic;">NO COMBAT RECORD FOUND</span>`;
            }
            
            const teamColor = getTeamColor(p.team);

            const modal = document.getElementById("playerModal");
            const bgLayer = document.getElementById("modalBgLayer");
            bgLayer.className = `bg-${rankCode}`;

            const modalContent = `
                <div class="modal-card ${luxuryClass}" id="tiltCard">
                    <div class="close-modal" onclick="closeModal()">✕</div>
                    <div class="card-header-bar">
                        <span class="header-stars">${stars}</span>
                        <span class="header-tier-text">${rankLabel}</span>
                    </div>
                    <div class="card-visual-area">
                        <div class="battle-type-badge" style="border-color:${settings.type.color}; color:${settings.type.color}">${settings.type.name}</div>
                        <div class="pilot-title">"${settings.title}"</div>
                        <img class="cartoon-avatar" src="${settings.imageUrl}" alt="Mecha Unit">
                        <div class="card-radar-bg" id="radarChart"></div>
                    </div>
                    <div class="card-info-area">
                        <div class="info-name">${p.name}</div>
                        <div class="info-meta"><span>ID: ${p.id}</span><span>TEAM: ${p.team !== '-' ? `<span style="color:${teamColor}; font-weight:bold;">${p.team}</span>` : 'NONE'}</span></div>
                        
                        <div class="skill-chips">
                            <div class="chip">ATK: ${attrs[0]}</div><div class="chip">DEF: ${attrs[1]}</div><div class="chip">SPD: ${attrs[2]}</div><div class="chip">TEC: ${attrs[3]}</div>
                        </div>

                        <div class="card-history-box">
                            <div class="history-label">
                                <span>BATTLE LOG</span>
                                <span>REC: ${p.history.length}</span>
                            </div>
                            <div class="history-list-content">
                                ${historyHTML}
                            </div>
                        </div>

                        <div class="card-sync-box">
                            <span class="card-sync-label">SYNC RATE</span>
                            <div class="sync-bar-container" style="flex:1; margin:0 10px;"><div class="sync-fill" id="syncFillBar" style="width: 0%;"></div></div>
                            <span class="card-sync-val" id="mScore">0</span>
                        </div>
                    </div>
                </div>
            `;

            Array.from(modal.children).forEach(child => {
                if (child.id !== 'modalBgLayer') child.remove();
            });

            modal.insertAdjacentHTML('beforeend', modalContent);
            modal.style.display = "flex";
            
            setTimeout(() => modal.classList.add("active"), 10);

            modal.onclick = (e) => {
                if(e.target === modal || e.target.id === 'modalBgLayer') closeModal();
            };

            const card = document.getElementById("tiltCard");
            
            // --- 滑鼠與手機觸控共用邏輯 ---
            function handleTilt(clientX, clientY, isTouch) {
                const rect = card.getBoundingClientRect();
                const x = clientX - rect.left; 
                const y = clientY - rect.top;
                const centerX = rect.width / 2; 
                const centerY = rect.height / 2;
                
                card.style.transition = 'none';
                // 手機觸控時稍微減弱傾斜幅度，避免太過敏感
                const tiltMultiplier = isTouch ? 5 : 10;
                card.style.transform = `perspective(1000px) rotateX(${((y - centerY) / centerY) * -tiltMultiplier}deg) rotateY(${((x - centerX) / centerX) * tiltMultiplier}deg)`;
            }

            function handleTiltReset() {
                card.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
            }

            // PC 滑鼠事件
            card.addEventListener('mousemove', (e) => handleTilt(e.clientX, e.clientY, false));
            card.addEventListener('mouseleave', handleTiltReset);

            // 手機觸控事件
            card.addEventListener('touchmove', (e) => {
                // 只有在畫面高度足夠，不需要捲動卡片時，才防止預設滑動行為
                if(window.innerHeight > 680) {
                    e.preventDefault(); 
                }
                handleTilt(e.touches[0].clientX, e.touches[0].clientY, true);
            }, { passive: false });
            card.addEventListener('touchend', handleTiltReset);
            card.addEventListener('touchcancel', handleTiltReset);

            setTimeout(() => {
                document.getElementById("syncFillBar").style.width = `${barWidth}%`;
            }, 100);

            drawRadar(p.score);
            
            const scoreEl = document.getElementById("mScore");
            let start = 0; const end = p.score;
            function animateScore() { 
                start += Math.ceil((end - start) / 10); 
                scoreEl.innerText = start; 
                if(start < end) {
                    requestAnimationFrame(animateScore); 
                } else {
                    scoreEl.innerText = end;
                }
            }
            animateScore();
        }

        function drawRadar(score) {
            const container = document.getElementById("radarChart");
            if(!container) return;
            const size = 250, center = size/2, radius = 90;
            const stats = [Math.min(1, 0.5+(score%20)/40+0.2), Math.min(1, 0.5+(score%15)/35+0.2), Math.min(1, 0.5+(score%18)/40+0.2), Math.min(1, 0.5+(score%22)/45+0.2), Math.min(1, 0.5+(score%12)/30+0.2), Math.min(1, 0.5+(score%25)/50+0.2)];
            const angles = [0, 60, 120, 180, 240, 300];
            const points = angles.map((a, i) => { const rad = (a-90)*Math.PI/180; return `${center+radius*stats[i]*Math.cos(rad)},${center+radius*stats[i]*Math.sin(rad)}`; }).join(" ");
            let svgHTML = `<svg width="100%" height="100%" viewBox="0 0 ${size} ${size}">`;
            [1, 0.5].forEach(s => { const p = angles.map(a => `${center+radius*s*Math.cos((a-90)*Math.PI/180)},${center+radius*s*Math.sin((a-90)*Math.PI/180)}`).join(" "); svgHTML += `<polygon points="${p}" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />`; });
            svgHTML += `<polygon points="${points}" fill="rgba(57, 255, 20, 0.4)" stroke="var(--eva-green)" stroke-width="2" /></svg>`;
            container.innerHTML = svgHTML;
        }

        function closeModal() { 
            // 關閉時解除背景鎖定
            document.body.style.overflow = '';
            const modal = document.getElementById("playerModal");
            modal.classList.remove("active");
            setTimeout(() => { modal.style.display = "none"; }, 300);
        }
    </script>
</body>
</html>
